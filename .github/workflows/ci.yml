name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - modern-api-102-general
      - modern-api-102-pixel-android16
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure optional signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No signing secrets configured; using the generated debug key."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.keystore
          {
            printf 'STORE_FILE_PATH=../release.keystore\n'
            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Build installable release APK
        run: |
          chmod +x gradlew
          version_name="actions-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          ./gradlew --build-cache --stacktrace \
            -PversionName="$version_name" \
            :app:assembleRelease

      - name: Verify Modern API 102 artifact
        shell: bash
        run: |
          set -euo pipefail
          module_prop='app/src/main/resources/META-INF/xposed/module.prop'
          if [ ! -f "$module_prop" ]; then
            echo 'Legacy branch detected; skipping Modern-only checks.'
            exit 0
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          entries="$(unzip -Z1 "$apk")"

          for entry in \
            META-INF/xposed/java_init.list \
            META-INF/xposed/module.prop \
            META-INF/xposed/scope.list; do
            grep -Fxq "$entry" <<<"$entries" || {
              echo "Missing Modern module entry: $entry" >&2
              exit 1
            }
          done
          if grep -Fxq 'assets/xposed_init' <<<"$entries"; then
            echo 'Legacy assets/xposed_init must not be packaged.' >&2
            exit 1
          fi

          unzip -p "$apk" META-INF/xposed/module.prop > packaged-module.prop
          grep -Fxq 'minApiVersion=102' packaged-module.prop
          grep -Fxq 'targetApiVersion=102' packaged-module.prop
          grep -Fxq 'staticScope=false' packaged-module.prop

          badging="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          expected_package="$(sed -n 's/.*APPLICATION_ID = "\([^"]*\)"/\1/p' build.gradle)"
          if [ -z "$expected_package" ]; then
            echo 'Unable to determine expected application ID.' >&2
            exit 1
          fi
          grep -Fq "package: name='$expected_package'" <<<"$badging"
          manifest_tree="$("$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump xmltree "$apk" AndroidManifest.xml)"
          if grep -Eq 'xposedmodule|xposedminversion|xposedscope' <<<"$manifest_tree"; then
            echo 'Legacy Xposed manifest metadata must not be packaged.' >&2
            exit 1
          fi

          unzip -p "$apk" 'classes*.dex' > packaged-classes.dex
          strings packaged-classes.dex > packaged-dex-strings.txt
          if grep -Eq 'de[./]robv[./]android[./]xposed' packaged-dex-strings.txt; then
            echo 'Legacy de.robv.android.xposed reference found in release DEX.' >&2
            exit 1
          fi

          signer_output="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_output"
          if [ -f release.keystore ]; then
            grep -Fqi \
              'Signer #1 certificate SHA-256 digest: a73b1a3459fb842f8a39c86ef0fe29e496486361db032085d3345b6b97dd3395' \
              <<<"$signer_output" || {
                echo 'Release APK was not signed with the long-term MiPush certificate.' >&2
                exit 1
              }
          fi

      - name: Name artifact
        id: artifact
        shell: bash
        run: echo "name=MiPush-${GITHUB_SHA::7}-release" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
