name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - pixel-android-16-notification-badge
  pull_request:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure optional signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No signing secrets configured; using the generated debug key."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.keystore
          {
            printf 'STORE_FILE_PATH=../release.keystore\n'
            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Build installable release APK
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --stacktrace \
            -PversionName="actions-${GITHUB_SHA::7}" \
            :app:assembleRelease

      - name: Name artifact
        id: artifact
        shell: bash
        run: echo "name=MiPush-${GITHUB_SHA::7}-release" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
